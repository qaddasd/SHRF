[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shrf"
version = "0.1.0"
description = "Shrinkage Heap Regression Forest memory for language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.6"]

[tool.setuptools.packages.find]
include = ["shrf*"]
namespaces = false

[tool.ruff]
target-version = "py310"
extend-exclude = ["SHRF-publish"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "ISC004", "RUF007"]
